[project]
name = "urdu-video-studio-backend"
version = "0.1.0"
description = "Backend API, RQ worker, and scheduler for Urdu Video Studio (Student Video Generation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "rq>=1.16",
    "argon2-cffi>=23.1",
    "boto3>=1.34",
    "resend>=2.0",
    "pydantic>=2.9",
    "email-validator>=2.0",
    "pydantic-settings>=2.5",
    "openai-agents>=0.0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "runpod>=1.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-default is the documented idiom, not a bug.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
