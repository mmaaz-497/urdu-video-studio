# cPanel EA4 userdata include - plain HTTP virtual host (T094).
# Install as: /etc/apache2/conf.d/userdata/std/2_4/<cpuser>/<domain>/urdu-video-studio.conf
#
# The app is HTTPS-only (its cookies are Secure), so plain HTTP just redirects - except
# /.well-known/, which AutoSSL's HTTP validation must reach on port 80.

<IfModule rewrite_module>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</IfModule>
