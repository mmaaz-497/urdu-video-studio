# cPanel EA4 userdata include - HTTPS virtual host (T094).
# Install as: /etc/apache2/conf.d/userdata/ssl/2_4/<cpuser>/<domain>/urdu-video-studio.conf
# then: /scripts/rebuildhttpdconf && apachectl -t && /scripts/restartsrv_httpd
# Apache includes this file INSIDE the domain's <VirtualHost *:443>; it touches nothing else.
#
# Same origin: the browser only ever talks to https://<domain>/ ; Apache splits it:
#   /.well-known/*  -> Apache itself (AutoSSL / ACME validation; never proxied)
#   /api/*          -> backend  127.0.0.1:8100  (the /api prefix is stripped, exactly like
#                      the Next.js dev rewrite; covers /api/static and /api/downloads too)
#   everything else -> frontend 127.0.0.1:3100

<IfModule proxy_http_module>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Exclusions must come before the catch-all ProxyPass.
    ProxyPass /.well-known/ !

    ProxyPass        /api/ http://127.0.0.1:8100/ connectiontimeout=5 timeout=120 keepalive=On
    ProxyPassReverse /api/ http://127.0.0.1:8100/

    ProxyPass        /     http://127.0.0.1:3100/ connectiontimeout=5 timeout=60 keepalive=On
    ProxyPassReverse /     http://127.0.0.1:3100/

    # Tell the app the browser used HTTPS (uvicorn runs with --proxy-headers).
    <IfModule headers_module>
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
    </IfModule>
</IfModule>
